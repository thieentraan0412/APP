[package]
name = "desktop"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
# feature "wgc" = chụp qua Windows Graphics Capture thay cho GDI BitBlt (mặc định của xcap).
# BẮT BUỘC phải bật: BitBlt chép lại framebuffer ĐÃ bị driver màn hình làm tối. Đo trên máy
# thật, cùng một cửa sổ chụp liên tiếp bằng hai đường: BitBlt cho kênh cao nhất 222/255 và
# KHÔNG có nổi một pixel trắng nào, PrintWindow cho 255 với 297k pixel trắng. Tức mọi ảnh
# chụp bị nhân ~0.871 — vừa xám vừa mất 13% tương phản chữ/nền nên nhìn như bị mờ.
# WGC đọc thẳng surface DWM nên ra đúng 255. Cần Windows 10 1903 trở lên.
xcap = { version = "0.9.6", features = ["wgc"] }
image = "0.25.10"
base64 = "0.22.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
arboard = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# Tối ưu thời gian BUILD (app nhẹ nên không cần tối ưu runtime cao):
# opt-level 1 + nhiều codegen-units -> compile nhanh hơn nhiều so với mặc định (opt-level 3).
[profile.release]
opt-level = 1
codegen-units = 256
lto = false
strip = true

